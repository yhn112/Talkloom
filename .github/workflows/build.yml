# The project's gate, run on a machine that has never seen this repository before.
#
# `scripts/check.sh` is the whole definition of verified-without-hardware, so this calls it
# instead of restating its steps: a step added there is covered here the same day. What CI
# adds is the clean checkout — XcodeGen builds the source list from the filesystem, so a file
# that exists locally and was never committed compiles at home and is missing for everyone
# else — and a Release build, which the local gate never makes.
#
# Device tests are absent by construction. They live in their own schemes behind
# TRANSCRIBER_DEVICE_TESTS, need a microphone, and make audible noise.
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      # Publishing the rolling build writes a release and a tag. Nothing else here needs it,
      # and the workflow default above stays read.
      contents: write
    # Pinned rather than macos-latest. This image carries Xcode 26.6 (17F113), the toolchain
    # the project is developed against and the one Package.swift's tools version requires; a
    # moving label would change the compiler without a commit saying so.
    runs-on: macos-26
    env:
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/ci-signing.xcconfig
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      # persist-credentials: false because nothing after this step speaks to git over the
      # network. The release is created through the API with GH_TOKEN, and the only git call
      # left reads the local HEAD. Leaving the token in .git/config would put it one careless
      # `ditto` away from an artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Through the Brewfile rather than naming tools here, so adding one is a single edit
      # and the documented setup is what gets exercised.
      - name: Install the command-line tools
        run: brew bundle

      # Without a .venv, check.sh skips its tooling step rather than failing it. Building one
      # from uv.lock is what gives that step something to check, and proves the lock resolves.
      - name: Create the evaluation environment
        run: uv sync

      - name: scripts/check.sh
        run: scripts/check.sh

      # After the gate, not inside it: instrumentation slows the build, and coverage is a
      # measurement rather than a pass/fail. Two reports, because the two halves of this
      # project mean different things when measured — codecov.yml explains which and why.
      - name: Measure coverage
        run: scripts/coverage.sh

      - name: Upload core coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/core.lcov
          flags: core
          fail_ci_if_error: true

      - name: Upload app coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/app.lcov
          flags: app
          fail_ci_if_error: true

      # check.sh builds Debug, so ENABLE_HARDENED_RUNTIME=YES is exercised nowhere else. It
      # changes what dyld agrees to load, which is the kind of break that would otherwise
      # surface the first time someone tried to cut a release.
      - name: Release build
        shell: bash
        run: |
          xcodebuild -project Transcriber.xcodeproj -scheme Transcriber \
            -configuration Release -derivedDataPath build-release build \
            | xcsift -f toon -w -E

      # A disk image rather than the bundle: upload-artifact zips what it is handed, and a
      # zipped .app loses the symlinks and permission bits that make it launchable.
      #
      # Staged with a link to /Applications beside the app, so installing is the drag everyone
      # already knows rather than a bundle sitting alone in a window. ditto rather than cp: it
      # is the tool that carries a bundle's metadata across intact, and a mangled bundle is a
      # broken signature.
      #
      # The image is ad-hoc signed and not notarized, which is a decision and not an omission —
      # this project is not distributed. .github/release-notes.md tells whoever downloads one
      # what that costs them.
      - name: Package the app
        run: |
          stage="$(mktemp -d)"
          ditto build-release/Build/Products/Release/Transcriber.app "$stage/Transcriber.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Transcriber -ov -format UDZO -quiet \
            -srcfolder "$stage" Transcriber.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Transcriber-${{ github.sha }}
          path: Transcriber.dmg
          retention-days: 14

      # A rolling prerelease rather than one release per tag. There is nothing to version yet
      # — project.yml pins 0.1.0 and nothing moves it — and the useful property is that the
      # newest build is one click from the front page instead of three from a run's page.
      # Prerelease because it is honestly not a release; the badge says so on the page.
      #
      # Delete and recreate rather than upload over: that is what moves the tag onto this
      # commit, and a `latest` tag pointing at an older one is worse than no tag.
      - name: Publish the latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Transcriber.dmg \
            --prerelease \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes-file .github/release-notes.md
