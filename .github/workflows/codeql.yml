# CodeQL, configured rather than guessed.
#
# Default setup analysed 18 of 52 Swift files and reported success. The reason is that
# Transcriber.xcodeproj is generated by XcodeGen and deliberately absent from git, so
# autobuild found Packages/TranscriberCore/Package.swift, built the package, and stopped —
# leaving the app target, which is every line that touches CoreAudio, out of the database.
# A partial database that reports success is worse than no database, because the empty
# results read as "nothing wrong here".
#
# So the Swift build is explicit: generate the project first, then build it the way the gate
# does. Only the languages this project is actually written in are analysed; `Brewfile` is
# what made Linguist report Ruby, and .gitattributes now says otherwise.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off the hour: a scheduled scan competing with everyone else's midnight cron
    # gets queued rather than run.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift has to be built, and building it needs macOS, Xcode and XcodeGen.
          - language: swift
            runner: macos-26
            build-mode: manual
          # These two are read, not built, so the cheap runner is the right one.
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: python
            runner: ubuntu-latest
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Everything CodeQL should see has to be compiled between init and analyze, because it
      # observes the compiler rather than reading the sources. Both halves are built for that
      # reason: the app scheme covers the app, its tests and the package it depends on, while
      # ASREvalSupport and OpenRouterASREval are separate products nothing in the app imports,
      # so `swift build` is what puts them in the database.
      #
      # Signing is overridden exactly as in build.yml, and for the same reason: the named
      # certificate exists to keep TCC grants alive on a development machine, and a runner has
      # none to keep.
      - name: Build for analysis
        if: matrix.language == 'swift'
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/ci-signing.xcconfig
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew bundle
          xcodegen generate --quiet
          swift build --package-path Packages/TranscriberCore
          xcodebuild -project Transcriber.xcodeproj -scheme Transcriber \
            -configuration Debug -derivedDataPath build-codeql build-for-testing

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
