# XcodeGen project definition — the source of truth instead of .xcodeproj.
# Edit here, then run `xcodegen generate`. The .xcodeproj is not kept in git.

name: Transcriber

options:
  bundleIdPrefix: me.diskin
  deploymentTarget:
    macOS: "14.2"          # floor imposed by CoreAudio process taps
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Races in audio code are far cheaper to catch at compile time than in production.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # A local self-signed certificate stays stable across builds, so TCC grants survive.
    # See scripts/make-signing-cert.sh
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Transcriber Dev"
    DEVELOPMENT_TEAM: ""
    # Xcode splits the app into a stub plus Transcriber.debug.dylib to support SwiftUI
    # Previews. dyld then refuses to load that dylib into the app because a self-signed
    # certificate carries no Team ID, and "unset" does not count as a match. Previews
    # need the Xcode GUI anyway, so turn the split off and keep one signed binary.
    ENABLE_DEBUG_DYLIB: NO
  configs:
    Debug:
      # The hardened runtime makes dyld require a matching Team ID for any code loaded
      # into the process. A self-signed certificate has no Team ID, so the XCTest bundle
      # cannot be injected into the app and every test run dies before starting. It is a
      # distribution requirement, not a development one, so it stays off while debugging.
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  # Lock-free cursors for the capture ring buffer. Swift's own `Synchronization.Atomic`
  # would do, but it is macOS 15+, and the deployment floor here is 14.2.
  #
  # Pinned exactly rather than `from:`. Package.resolved lives inside the generated
  # .xcodeproj, which is not in git, so nothing else in the repository records which
  # version was built. With a range, a clean checkout could silently resolve to a
  # different one, and the first place that would show up is a ring buffer that stopped
  # being lock-free. Raising it is a deliberate edit here.
  Atomics:
    url: https://github.com/apple/swift-atomics
    exactVersion: "1.3.1"

targets:
  Transcriber:
    type: application
    platform: macOS
    sources:
      # Created in stage 0 (see PLAN.md); generation fails until it exists.
      - path: Sources/Transcriber
    settings:
      base:
        PRODUCT_NAME: Transcriber
        PRODUCT_BUNDLE_IDENTIFIER: me.diskin.Transcriber
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Transcriber.entitlements
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - package: Atomics

  TranscriberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TranscriberTests
    dependencies:
      - target: Transcriber
    settings:
      base:
        # The app bundle uses the checked-in Resources/Info.plist; a test bundle has no
        # plist of its own, and codesign refuses to sign a bundle without one.
        GENERATE_INFOPLIST_FILE: YES
        # Inherit the app's signing identity rather than signing ad-hoc. The test bundle
        # is injected into the app process, and dyld refuses to load code whose team
        # identity differs from the host's.

schemes:
  Transcriber:
    build:
      targets:
        Transcriber: all
        TranscriberTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TranscriberTests

  # The tests that record from the real microphone. They are a separate scheme rather than
  # an environment variable on the command line because xcodebuild does not forward the
  # shell's environment to the test host — the variable has to come from the scheme.
  # Opt-in, since they need a microphone and make audible noise.
  TranscriberDeviceTests:
    build:
      targets:
        Transcriber: all
        TranscriberTests: [test]
    test:
      config: Debug
      targets:
        - TranscriberTests
      environmentVariables:
        TRANSCRIBER_DEVICE_TESTS: "1"
