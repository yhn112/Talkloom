# XcodeGen project definition — the source of truth instead of .xcodeproj.
# Edit here, then run `xcodegen generate`. The .xcodeproj is not kept in git.

name: Transcriber

options:
  bundleIdPrefix: me.diskin
  deploymentTarget:
    # CoreAudio process taps need 14.2; the floor is 15.0 because `Synchronization.Atomic`
    # is, and the ring buffer would otherwise carry a package dependency for cursors the
    # standard library already provides. Nothing above 15 buys anything measured: the tap
    # additions in 26 (`bundleIDs`, `processRestoreEnabled`) apply to per-process taps and
    # this app takes a global one, and macOS 26's SpeechTranscriber lists 30 locales with
    # no Russian among them, so it cannot transcribe half of the meetings this is for.
    macOS: "15.0"

  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Races in audio code are far cheaper to catch at compile time than in production.
    SWIFT_STRICT_CONCURRENCY: complete
    # AGENTS.md forbids silencing compiler warnings; this is that rule with teeth. A
    # warning here is usually the compiler describing exactly the class of mistake this
    # project cannot afford — an unused result from a CoreAudio call, a capture of self in
    # an escaping closure, a deprecated API that still compiles. Dependencies built by
    # SwiftPM keep their own settings and are unaffected.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # A local self-signed certificate stays stable across builds, so TCC grants survive.
    # See scripts/make-signing-cert.sh
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Transcriber Dev"
    DEVELOPMENT_TEAM: ""
    # Xcode splits the app into a stub plus Transcriber.debug.dylib to support SwiftUI
    # Previews. dyld then refuses to load that dylib into the app because a self-signed
    # certificate carries no Team ID, and "unset" does not count as a match. Previews
    # need the Xcode GUI anyway, so turn the split off and keep one signed binary.
    ENABLE_DEBUG_DYLIB: NO
  configs:
    Debug:
      # The hardened runtime makes dyld require a matching Team ID for any code loaded
      # into the process. A self-signed certificate has no Team ID, so the XCTest bundle
      # cannot be injected into the app and every test run dies before starting. It is a
      # distribution requirement, not a development one, so it stays off while debugging.
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  # The hardware-free boundary described in AGENTS.md. A local package rather than a folder
  # in the app target so its tests run without xcodebuild, signing, or a test host.
  TranscriberCore:
    path: Packages/TranscriberCore

targets:
  Transcriber:
    type: application
    platform: macOS
    sources:
      # Created in stage 0 (see PLAN.md); generation fails until it exists.
      - path: Sources/Transcriber
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Transcriber
        PRODUCT_BUNDLE_IDENTIFIER: me.diskin.Transcriber
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Transcriber.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - package: TranscriberCore

  TranscriberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TranscriberTests
    dependencies:
      - target: Transcriber
    settings:
      base:
        # The app bundle uses the checked-in Resources/Info.plist; a test bundle has no
        # plist of its own, and codesign refuses to sign a bundle without one.
        GENERATE_INFOPLIST_FILE: YES
        # Inherit the app's signing identity rather than signing ad-hoc. The test bundle
        # is injected into the app process, and dyld refuses to load code whose team
        # identity differs from the host's.

schemes:
  Transcriber:
    build:
      targets:
        Transcriber: all
        TranscriberTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TranscriberTests

  # The tests that record from the real microphone. They are a separate scheme rather than
  # an environment variable on the command line because xcodebuild does not forward the
  # shell's environment to the test host — the variable has to come from the scheme.
  # Opt-in, since they need a microphone and make audible noise.
  TranscriberDeviceTests:
    build:
      targets:
        Transcriber: all
        TranscriberTests: [test]
    test:
      config: Debug
      targets:
        - TranscriberTests
      environmentVariables:
        TRANSCRIBER_DEVICE_TESTS: "1"

  # The capture-restart test includes a timed manual output-device switch. Keep it out of
  # ordinary device runs so a person is never surprised by an interactive hardware test.
  TranscriberDeviceSwitchTests:
    build:
      targets:
        Transcriber: all
        TranscriberTests: [test]
    test:
      config: Debug
      targets:
        - TranscriberTests
      environmentVariables:
        TRANSCRIBER_DEVICE_TESTS: "1"
        TRANSCRIBER_DEVICE_SWITCH_TEST: "1"
        TRANSCRIBER_DEVICE_SWITCH_ROOT: "/tmp/TranscriberDeviceSwitchRecording"
